# CI minimale honnete (REFERENCE-PROJET.md §9) : format + lint + build + tests.
# Enrichie a chaque jalon (cargo-audit/deny des J1, fuzz/miri sur tova-core).
name: ci
on:
  pull_request:
  push:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain Rust stable (+ clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Tests
        run: cargo test --workspace --all-features

  # Verifie la MSRV declaree (Cargo.toml rust-version) : sinon la valeur n'est qu'une promesse non testee.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain MSRV figee
        uses: dtolnay/rust-toolchain@1.74.0
      - uses: Swatinem/rust-cache@v2
      - name: Build sur la MSRV
        run: cargo build --workspace

  # tova-core vise WASM (no_std+alloc) : exerce la cible des maintenant pour attraper toute regression de portabilite.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain stable + cible wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build tova-core en wasm32
        run: cargo build -p tova-core --target wasm32-unknown-unknown

  # Refuse une PR sans entree de journal dans logs/ (REFERENCE §7, §9), sauf label "skip-log".
  log-present:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verifier la presence d'un log
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-log') }}
        run: |
          base="origin/${{ github.base_ref }}"
          # Exige un VRAI journal date (logs/YYYY-MM-DD__role__slug.md), pas seulement logs/README.md.
          if git diff --name-only "$base"...HEAD | grep -qE '^logs/[0-9]{4}-[0-9]{2}-[0-9]{2}__.+\.md$'; then
            echo "OK : au moins un journal date logs/AAAA-MM-JJ__*.md present dans la PR."
          else
            echo "REFUS : aucun journal date logs/AAAA-MM-JJ__*.md dans cette PR (ajoute un log ou pose le label 'skip-log')."
            exit 1
          fi
