# Workspace TOVA — squelette pose au jalon J0.
# Les crates applicatives (tova-board, tova-protocol, tova-threshold, tova-node,
# tova-wasm, tova-cli, tova-verify) sont ajoutees au fil des jalons J1->J4 (voir docs/backlog.md).
[workspace]
resolver = "2"
members = ["crates/tova-core"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/TristanPLS/tova"
# MSRV verifiee par le job CI `msrv`. Plancher reel = 1.85 : l'arbre de deps (zeroize_derive 1.5)
# utilise l'edition 2024, stabilisee en Rust 1.85. Valeur realiste pour un projet 2026 (cf. CONS-5/ARCH-1).
rust-version = "1.85"

# Pin unique des deps crypto partagees par toutes les crates (evite la derive de version
# de curve25519-dalek -> types RistrettoPoint incompatibles). Chaque crate herite via `.workspace = true`.
[workspace.dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize", "rand_core"] }
merlin = { version = "3", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
rand_core = { version = "0.6", default-features = false }

# Profils : la crypto a besoin d'optimisations meme en dev pour des tests rapides.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
