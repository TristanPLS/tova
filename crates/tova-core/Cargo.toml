[package]
name = "tova-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Coeur cryptographique de TOVA : signature de cercle linkable (bLSAG/CLSAG mono-layer) + key image, et bulletin ElGamal exponentiel + preuve de validite, sur Ristretto255."
publish = false

[dependencies]
curve25519-dalek.workspace = true
merlin.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
rand_core.workspace = true

[dev-dependencies]
# Tests sur l'hote (std) : RNG reproductible, proptests, vecteurs hex.
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
hex = "0.4"
